name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's patch and minor updates of development dependencies and
# GitHub Actions. GitHub then squash-merges the pull request once the required checks pass.
# Runtime dependencies and major updates stay for a person to review (docs/releasing.md).
# `pull_request`, never `pull_request_target` (which runs with write access on behalf of the pull
# request): this job checks out and runs nothing from it.

on: pull_request

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Also checks that Dependabot opened the pull request and that all its commits are its own.
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # `dependency-type` and `update-type` are the strictest of a grouped pull request: one
      # runtime dependency or one major update keeps the whole group manual. A GitHub Action is
      # not a development dependency, so it is matched by `package-ecosystem` instead.
      - name: Enable auto-merge
        if: >-
          ${{
            contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'),
              steps.metadata.outputs.update-type)
            && (steps.metadata.outputs.dependency-type == 'direct:development'
              || steps.metadata.outputs.package-ecosystem == 'github_actions')
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
