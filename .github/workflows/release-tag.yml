# Fallback path: a maintainer pushes a v* tag by hand (for example when release-please
# cannot open pull requests). Creates the release from CHANGELOG.md and attaches assets. Only a
# tag on a commit of main is released: anything else would ship code that skipped review.
name: Release from tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          [[ "$status" == identical || "$status" == behind ]] || { echo "$TAG is not on main ($status)"; exit 1; }

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          node scripts/release-notes.mjs "$TAG" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag --draft

  assets:
    name: Release assets
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.ref_name }}

  # Chrome Web Store: waits for approval in the `chrome-web-store` environment. Skipped until
  # the store item is set up (docs/chrome-web-store.md), so releases keep working without it.
  store:
    name: Chrome Web Store
    needs: assets
    if: vars.CWS_ITEM_ID != ''
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/chrome-web-store.yml
    with:
      tag: ${{ github.ref_name }}
