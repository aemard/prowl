# Reusable: builds the release zip, SBOM and provenance, attaches them to the draft release and
# publishes it. Releases are immutable once published, so the assets go on while it is a draft.
name: Release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  assets:
    name: Build and attach assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: a cache written by another workflow must not reach the build
          # that gets signed provenance.

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Optional: an OAuth App client ID with device flow enabled (repository variable).
          PROWL_GITHUB_CLIENT_ID: ${{ vars.PROWL_GITHUB_CLIENT_ID }}
        run: pnpm build && pnpm size && pnpm zip

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: prowl-${{ inputs.tag }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: prowl-v*.zip

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" prowl-v*.zip "prowl-$TAG.sbom.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
