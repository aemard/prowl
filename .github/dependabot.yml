version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # pnpm 12 refuses packages published less than a day ago (minimumReleaseAge), which would
    # leave a fresh release's pull request red until the next day.
    cooldown:
      default-days: 2
    ignore:
      # Majors are a decision, see docs/decisions.md: @types/node follows .nvmrc.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: preact
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
