version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Two groups, because only one may merge itself (dependabot-auto-merge.yml, docs/decisions.md):
    # tools that test, lint and type-check, which never run in a release; and everything else
    # that is a development dependency, which builds what ships (Vite and its plugins, fflate
    # for the zip, the website) and waits for a person. A new tool lands in build-chain until
    # it is added to test-tooling here.
    groups:
      test-tooling:
        dependency-type: development
        update-types: [minor, patch]
        patterns:
          - vitest
          - '@vitest/*'
          - happy-dom
          - '@testing-library/*'
          - '@playwright/test'
          - '@axe-core/*'
          - fast-check
          - graphql
          - '@biomejs/biome'
          - typescript
          - '@types/*'
          - lighthouse
          - chrome-launcher
      build-chain:
        dependency-type: development
        update-types: [minor, patch]
    # pnpm 12 refuses packages published less than a day ago (minimumReleaseAge), which would
    # leave a fresh release's pull request red until the next day.
    cooldown:
      default-days: 2
    ignore:
      # Majors are a decision, see docs/decisions.md: @types/node follows .nvmrc.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: preact
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, or the CodeQL job fails: separate pull requests
      # for each could never pass alone.
      codeql-action:
        patterns: ['github/codeql-action*']
    open-pull-requests-limit: 5
